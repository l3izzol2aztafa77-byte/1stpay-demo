<title>1st Pay</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#F5F3EE;--card:#FFFFFF;--ink:#17243B;--soft:#566378;--line:#E2DDD2;--primary:#1E3358;--onPrimary:#FFFFFF;--accent:#1E3358;--gold:#C9A55A;--goldSoft:#F5EDDC;--goldInk:#7E5F1F;--ok:#2B7A4B;--okSoft:#E2F1E7;--err:#B3402F;--errSoft:#FBEAE6;--chip:#ECE8DF;--bgImg:url(assets/bg.jpg);--logoImg:url(assets/logo.png);color-scheme:light}
:root[data-theme="dark"]{--bg:#0C1422;--card:#15203A;--ink:#EEF1F6;--soft:#A3AEC2;--line:#28344E;--primary:#D4B26A;--onPrimary:#111A2C;--accent:#E0C27E;--gold:#D4B26A;--goldSoft:#2C2616;--goldInk:#E6CB8C;--ok:#74CF98;--okSoft:#12291C;--err:#F0937F;--errSoft:#2E1612;--chip:#1C2842;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans','Noto Sans Thai','Noto Sans Lao','Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
.logo{aspect-ratio:650/589;flex-shrink:0;background-image:var(--logoImg);background-size:contain;background-repeat:no-repeat;background-position:center}
.sora{font-family:Sora,sans-serif}
.btn-p{height:60px;border-radius:18px;border:none;background:var(--primary);color:var(--onPrimary);font-size:19px;font-weight:700;width:100%}
.btn-s{height:60px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;font-weight:700;width:100%}
.btn-g{height:60px;border-radius:18px;border:none;background:var(--gold);color:#1B2640;font-size:19px;font-weight:700;width:100%}
.btn-link{background:none;border:none;color:var(--accent);font-size:16px;font-weight:700;padding:10px 0}
.circle{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.langbtn{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-shrink:0}
.title{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:8px}
.sub{font-size:16px;color:var(--soft);line-height:1.6;margin-bottom:28px;text-wrap:pretty}
.lbl{font-size:15px;font-weight:600;color:var(--soft);margin-bottom:8px}
.field{display:flex;align-items:stretch;height:64px;border:2px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.field:focus-within{border-color:var(--gold)}
.field .pre{display:flex;align-items:center;padding:0 16px;background:var(--chip);font-family:Sora,sans-serif;font-weight:600;font-size:18px;color:var(--ink)}
.field input{flex:1;min-width:0;border:none;background:transparent;padding:0 16px;font-size:20px;color:var(--ink);outline:none}
.field input.num{font-family:Sora,sans-serif;font-size:22px;letter-spacing:1px}
.err{color:var(--err);font-size:15px;font-weight:600;margin-top:10px;min-height:22px}
.screen{display:flex;flex-direction:column;flex:1;padding:20px 24px 28px}
.grow{flex:1;min-height:24px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:18px;padding:5px;gap:5px;margin-bottom:20px}
.tabs2 button{height:52px;border-radius:14px;border:none;background:transparent;color:var(--soft);font-size:17px;font-weight:700}
.tabs2 button.on{background:var(--card);color:var(--ink)}
.dev{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--goldSoft);color:var(--goldInk);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.dev button{border:none;background:var(--gold);color:#1B2640;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
.sandbox{position:fixed;left:0;right:0;top:0;height:22px;z-index:60;background:var(--goldSoft);color:var(--goldInk);font-size:11.5px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;pointer-events:none}
body.sb{padding-top:22px}body.sb aside{top:22px !important;height:calc(100vh - 22px) !important}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.rowbtn{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:0 18px;border:none;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:17px;font-weight:600;text-align:left}
.rowbtn:last-child{border-bottom:none}
.rowbtn .v{color:var(--soft);font-size:16px}.rowbtn .ch{color:var(--soft);font-size:22px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

};
const t = () => I18N[S.lang] || I18N.th;

function go(v){ S.stack.push(v); S.err = ''; render(); scrollTo(0, 0); }
function reset(v){ S.stack = [v]; S.err = ''; render(); scrollTo(0, 0); }
function back(){ if (S.stack.length > 1) S.stack.pop(); S.pinStage = 1; S.pin1 = S.pin2 = S.lpin = ''; S.pinErr = ''; S.err = ''; render(); }
let toastT; function toast(m){ clearTimeout(toastT); S.toast = m; render(); toastT = setTimeout(() => { S.toast = ''; render(); }, 2200); }
function setLang(c){ S.lang = c; store('1p_lang', c); S.langOpen = false; render(); }
function toggleTheme(){ S.theme = S.theme === 'dark' ? 'light' : 'dark'; store('1p_theme', S.theme); render(); }

/* ============================================================ API */
async function api(method, path, body, auth, extra, retried){
  const h = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
  if (auth && S.access) h.Authorization = 'Bearer ' + S.access;
  let r;
  try { r = await fetch(API + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw { code: 'NETWORK' }; }
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  const code = data && data.error && data.error.code || '';
  if (r.status === 401 && auth && S.refresh && !retried && /^ERR_(TOKEN|UNAUTHORIZED)/.test(code) && await refresh()) return api(method, path, body, auth, extra, true);
  if (!r.ok) throw (data && data.error) || { code: 'HTTP_' + r.status };
  return data;
}
async function refresh(){
  try {
    const r = await fetch(API + '/v1/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: S.refresh }) });
    if (!r.ok) { endSession(); return false; }
    saveTokens(await r.json()); return true;
  } catch (e) { return false; }
}
function saveTokens(tk){ S.access = tk.access_token; S.refresh = tk.refresh_token; ss('1p_rt', S.refresh); }
function endSession(){ S.access = S.refresh = S.user = null; S.kyc = null; S.kf = {}; S.kfiles = {}; ss('1p_rt', null);
  S.sub = null; S.subStack = []; S.recent = S.list = S.limits = S.summary = S.staticQr = S.pay = S.rc = S.sale = null; S.amt = '0'; if (typeof stopPoll === 'function') { stopPoll(); stopCam(); } }
function errMsg(e){
  const T = t();
  if (e.code === 'NETWORK') return T.network;
  const m = T.E[e.code] || I18N.en.E[e.code];
  return m ? m.replace('{s}', e.retry_after ?? '').replace('{n}', e.attempts_left ?? '') : (e.message || e.code);
}

/* ============================================================ flows */
const digits = v => v.replace(/\D/g, '');
function destValid(){ return S.ch === 'sms' ? /^(20\d{8}|30\d{7})$/.test(digits(S.dest).replace(/^0/, '')) : /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.dest.trim()); }
function destValue(){ return S.ch === 'sms' ? digits(S.dest).replace(/^0/, '') : S.dest.trim(); }
function startFlow(flow){
  S.flow = flow; S.dest = ''; S.otp = ''; S.err = '';
  S.ch = flow === 'add' ? (S.user && S.user.phone ? 'email' : 'sms') : 'sms';
  go('contact');
}
async function sendOtp(resend){
  if (S.busy) return;
  S.busy = true; S.err = ''; render();
  try {
    const purpose = { register: 'register', reset: 'reset_pin', add: 'add_contact' }[S.flow];
    const d = await api('POST', '/v1/auth/otp/request', { channel: S.ch, destination: destValue(), purpose, lang: API_LANG[S.lang] });
    S.ref = d.otp_ref; S.devOtp = d.dev_otp || null; S.sentTo = d.sent_to; S.otp = ''; S.sec = d.resend_after;
    S.busy = false;
    if (resend === true) render(); else go('otp');
  } catch (e) { S.busy = false; S.err = errMsg(e); render(); }
}
async function checkOtp(){
  if (S.busy || S.otp.length < 6) return;
  S.busy = true; S.err = ''; render();
  try {
    const d = await api('POST', '/v1/auth/otp/verify', { otp_ref: S.ref, code: S.otp });
    S.vt = d.verification_token; S.busy = false;
    if (S.flow === 'add') {
      S.user = await api('POST', '/v1/me/contact', { verification_token: S.vt }, true);
      S.tab = 'profile'; reset('shell'); toast(t().added); return;
    }
    S.pinStage = 1; S.pin1 = S.pin2 = ''; S.pinErr = ''; go('setPin');
  } catch (e) { S.busy = false; S.otp = ''; S.err = errMsg(e); render(); }
}
function pressSet(k){
  if (S.busy) return;
  if (S.pinStage === 1) {
    S.pin1 = k === 'del' ? S.pin1.slice(0, -1) : (S.pin1 + k).slice(0, 6); S.pinErr = ''; render();
    if (S.pin1.length === 6) setTimeout(() => { S.pinStage = 2; render(); }, 220);
  } else {
    S.pin2 = k === 'del' ? S.pin2.slice(0, -1) : (S.pin2 + k).slice(0, 6); render();
    if (S.pin2.length === 6) setTimeout(submitPin, 220);
  }
}
async function submitPin(){
  if (S.pin1 !== S.pin2) { S.pinErr = t().pinMismatch; S.pinStage = 1; S.pin1 = S.pin2 = ''; render(); return; }
  S.busy = true; render();
  try {
    if (S.flow === 'register') {
      const d = await api('POST', '/v1/auth/register', { verification_token: S.vt, pin: S.pin1, account_type: S.acct, lang: API_LANG[S.lang] });
      saveTokens(d.tokens); S.user = d.user; S.busy = false; S.pin1 = S.pin2 = ''; S.pinStage = 1;
      reset('regDone');
    } else {
      await api('POST', '/v1/auth/pin/reset', { verification_token: S.vt, new_pin: S.pin1 });
      S.busy = false; S.loginId = S.ch === 'sms' ? destValue() : S.dest.trim(); S.lpin = '';
      S.stack = ['splash', 'loginPin']; render(); toast(t().pinReset);
    }
  } catch (e) {
    S.busy = false; S.pinErr = errMsg(e); S.pinStage = 1; S.pin1 = S.pin2 = ''; render();
    if (['ERR_TOKEN_USED', 'ERR_TOKEN_EXPIRED'].includes(e.code)) setTimeout(() => { S.stack = ['splash', 'contact']; render(); }, 1600);
  }
}
function pressLogin(k){
  if (S.busy) return;
  S.lpin = k === 'del' ? S.lpin.slice(0, -1) : (S.lpin + k).slice(0, 6); S.pinErr = ''; render();
  if (S.lpin.length === 6) setTimeout(doLogin, 200);
}
async function doLogin(){
  S.busy = true; render();
  try {
    const d = await api('POST', '/v1/auth/login', { identifier: S.loginId, pin: S.lpin });
    saveTokens(d.tokens); S.user = d.user; S.busy = false; S.lpin = ''; S.tab = 'home'; await Promise.all([loadKyc(), loadHome()]); reset('shell');
  } catch (e) { S.busy = false; S.lpin = ''; S.pinErr = errMsg(e); render(); }
}
async function logout(){
  try { await api('POST', '/v1/auth/logout', { refresh_token: S.refresh }); } catch (e) {}
  endSession(); S.tab = 'home'; reset('splash');
}


/* ============================================================ KYC */
function kycReady(){
  const m = S.user && S.user.account_type === 'merchant', f = S.kf;
  const need = m ? ['business_name', 'full_name'] : ['full_name', 'dob', 'id_number'];
  return need.every(k => (f[k] || '').trim()) && S.kfiles.doc1 && S.kfiles.doc2;
}
async function loadKyc(){ try { S.kyc = await api('GET', '/v1/kyc', null, true); } catch (e) { S.kyc = null; } }
function compress(file){    // ย่อรูปจากมือถือให้เหลือด้านยาวไม่เกิน 1600px (JPEG) ก่อนอัปโหลด
  return new Promise(resolve => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b || file); }, 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function submitKyc(){
  if (S.busy || !kycReady()) return;
  S.busy = true; S.err = ''; render();
  const fd = new FormData();
  Object.entries(S.kf).forEach(([k, v]) => v && fd.append(k, v.trim()));
  fd.append('doc1', S.kfiles.doc1.blob, 'doc1.jpg'); fd.append('doc2', S.kfiles.doc2.blob, 'doc2.jpg');
  const send = () => fetch(API + '/v1/kyc', { method: 'POST', headers: { Authorization: 'Bearer ' + S.access }, body: fd });
  try {
    let r = await send();
    if (r.status === 401 && S.refresh && await refresh()) r = await send();
    const d = await r.json().catch(() => null);
    if (!r.ok) throw (d && d.error) || { code: 'HTTP_' + r.status };
    S.kyc = { kyc_level: 0, case: d.case }; S.kf = {}; S.kfiles = {}; S.busy = false;
    S.stack = ['shell', 'kycPending']; render(); scrollTo(0, 0);
  } catch (e) { S.busy = false; S.err = errMsg(e); render(); }
}

function qrImg(text, size){

async function startCam(){
  if (camStream || S.camErr) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { S.camErr = true; render(); return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    if (S.tab !== 'scan' || S.sub) { stopCam(); return; }
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
    if (!detector) await loadJsQR();
    render(); scanLoop();
  } catch (e) { S.camErr = true; render(); }
}
function stopCam(){ cancelAnimationFrame(camRAF); if (camStream) camStream.getTracks().forEach(tr => tr.stop()); camStream = null; }
function attachCam(){ const v = document.getElementById('cam'); if (v && camStream && v.srcObject !== camStream) { v.srcObject = camStream; v.play().catch(() => {}); } }
const scanCanvas = document.createElement('canvas');
async function scanLoop(){
  const v = document.getElementById('cam');
  if (!camStream) return;
  if (v && v.readyState >= 2 && !S.busy) {
    let code = null;
    try {
      if (detector) { const r = await detector.detect(v); code = r[0] && r[0].rawValue; }
      else if (window.jsQR) {
        const w = scanCanvas.width = Math.min(v.videoWidth, 640), h = scanCanvas.height = Math.round(v.videoHeight * w / v.videoWidth);
        const ctx = scanCanvas.getContext('2d', { willReadFrequently: true }); ctx.drawImage(v, 0, 0, w, h);
        const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); code = r && r.data;
      }
    } catch (e) {}
    if (code) { stopCam(); resolvePay({ payload: code }); return; }
  }
  camRAF = requestAnimationFrame(scanLoop);
}
function loadJsQR(){ return window.jsQR ? Promise.resolve() : new Promise(res => { const s = document.createElement('script'); s.src = ASSET + 'jsqr.min.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); }); }
async function decodeImage(file){
  await loadJsQR();
  const img = new Image(), url = URL.createObjectURL(file);
  await new Promise(r => { img.onload = r; img.onerror = r; img.src = url; });
  const k = Math.min(1, 1200 / Math.max(img.width || 1, img.height || 1));
  const w = scanCanvas.width = Math.max(1, Math.round(img.width * k)), h = scanCanvas.height = Math.max(1, Math.round(img.height * k));
  const ctx = scanCanvas.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
  const r = window.jsQR && jsQR(ctx.getImageData(0, 0, w, h).data, w, h);
  return r && r.data;
}
async function resolvePay(body){
  if (S.busy) return;
  S.busy = true; S.err = ''; render();
  try {
    const d = await api('POST', '/v1/pay/resolve', body, true);
    S.busy = false; S.pay = d; S.idem = uid(); S.ppin = ''; S.pinErr = ''; S.cat = 'food'; S.mcode = '';
    if (d.mode === 'dynamic') { S.amt = String(d.amount); openSub('payPin'); }
    else { S.amt = '0'; openSub('payAmount'); }
  } catch (e) { S.busy = false; S.err = errMsg(e); render(); if (S.tab === 'scan') startCam(); }
}

async function loadStaticQr(){ try { S.staticQr = await api('GET', '/v1/merchant/static-qr', null, true); } catch (e) { S.staticQr = null; } render(); }

/* ============================================================ render + events */
const root = document.getElementById('root');
function render(){
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.lang = S.lang;
  document.body.classList.toggle('sb', ENV !== 'prod');
  const focusId = document.activeElement && document.activeElement.id;
  const caret = focusId && document.activeElement.selectionStart;
  root.innerHTML = (cur() === 'shell' ? shellView() : authView()) + langSheet() + toastEl() + sandbox();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } }
  const scanning = cur() === 'shell' && S.tab === 'scan' && !S.sub && S.user && !isMerchant();
  if (scanning) { attachCam(); if (!camStream && !S.camErr) startCam(); } else if (camStream) stopCam();
}
const ACT = {
  back, toggleTheme, openLang: () => { S.langOpen = true; render(); }, closeLang: () => { S.langOpen = false; render(); }, setLang,
  goRegister: () => { S.acct = 'customer'; startFlow('register'); },
  goLogin: () => { S.ch = 'sms'; S.dest = ''; go('loginPhone'); },
  setAcct: a => { S.acct = a; render(); },
  toggleCh: () => { S.ch = S.ch === 'sms' ? 'email' : 'sms'; S.dest = ''; S.err = ''; render(); const el = document.getElementById('dest'); if (el) el.focus(); },
  sendOtp: () => sendOtp(false), resend: () => sendOtp(true), checkOtp,
  fillOtp: () => { S.otp = S.devOtp || ''; render(); checkOtp(); },
  pressSet, pressLogin,
  goLoginPin: () => { S.loginId = destValue(); S.lpin = ''; S.pinErr = ''; go('loginPin'); },
  forgot: () => { S.flow = 'reset'; S.ch = 'sms'; S.dest = /^\d/.test(S.loginId) ? S.loginId : ''; S.err = ''; go('contact'); },
  enterHome: () => { S.tab = 'home'; S.sub = null; reset('shell'); Promise.all([loadKyc(), loadHome()]).then(render); },
  soon: () => toast(t().soon),
  tab: k => { stopPoll(); S.sub = null; S.subStack = []; S.rcFresh = false; S.err = ''; S.tab = k || 'home';
    if (S.tab === 'receive') S.amt = '0';
    if (S.tab === 'scan') { S.camErr = false; S.mcode = ''; }
    render(); scrollTo(0, 0);
    if (S.tab === 'home' || S.tab === 'receive') loadHome().then(render);
    if (S.tab === 'history' || S.tab === 'sales') { S.filter = 'all'; loadList(); }
    if (S.tab === 'profile' && isMerchant() && S.summary && S.summary.can_receive) loadStaticQr(); },
  subBack: () => { if (S.sub === 'mQr') { cancelQr(); return; } if (S.sub === 'receipt' && S.rcFresh || S.sub === 'mDone') { goHomeTab(); return; } closeSub(); },
  filter: k => { S.filter = k; loadList(); },
  openTx, resolveCode: () => resolvePay({ code: S.mcode.trim() }),
  pressAmt, addAmt: v => { S.amt = String(Math.min((+S.amt || 0) + (+v), 9999999999)); render(); },
  setCat: k => { S.cat = k; render(); },
  goPayPin: () => { if (+S.amt > 0) { S.ppin = ''; S.pinErr = ''; openSub('payPin'); } },
  pressPayPin, shareRc, payHome: goHomeTab,
  goReceive: () => { if (S.summary && !S.summary.can_receive) { toast(t().kybFirst); return; } ACT.tab('receive'); },
  createQr, simulatePaid, cancelQr, newSale: () => { stopPoll(); S.sale = null; S.sub = null; S.subStack = []; S.amt = '0'; S.tab = 'receive'; render(); },
  downloadQr,
  addContact: () => startFlow('add'),
  goKyc: () => { S.err = ''; if (S.kyc && S.kyc.case && S.kyc.case.status === 'pending') { go('kycPending'); return; }
    if (!S.kf.full_name && S.user.full_name) S.kf.full_name = S.user.full_name; go('kycUpload'); },
  goKycPending: () => go('kycPending'),
  submitKyc,
  logout,
};
root.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]'); const b = e.target.closest('[data-act]');
  if (!b || (stop && !stop.contains(b))) return;
  if (b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset.arg);
});
root.addEventListener('change', async e => {
  const slot = e.target.dataset.file; if (!slot || !e.target.files || !e.target.files[0]) return;
  if (slot === 'qrimg') { const f = e.target.files[0]; e.target.value = ''; S.busy = true; render(); const code = await decodeImage(f); S.busy = false;
    if (code) resolvePay({ payload: code }); else { S.err = errMsg({ code: 'ERR_QR_INVALID' }); render(); } return; }
  const blob = await compress(e.target.files[0]);
  if (S.kfiles[slot]) URL.revokeObjectURL(S.kfiles[slot].url);
  S.kfiles[slot] = { blob, url: URL.createObjectURL(blob) }; S.err = ''; render();
});
root.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'mcode') { S.mcode = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 20); e.target.value = S.mcode; const p = document.getElementById('primary'); if (p) { const ok = S.mcode.length >= 4; p.disabled = !ok; p.style.opacity = ok ? 1 : .4; } return; }
  if (k === 'kf') { S.kf[e.target.dataset.k] = e.target.value; const p = document.getElementById('primary'); if (p) { const ok = kycReady(); p.disabled = !ok; p.style.opacity = ok ? 1 : .4; } return; }
  if (k === 'dest') {
    S.dest = S.ch === 'sms' ? digits(e.target.value).slice(0, 11) : e.target.value.slice(0, 254);
    if (S.ch === 'sms' && e.target.value !== S.dest) e.target.value = S.dest;
    const p = document.getElementById('primary'); if (p) { const ok = destValid(); p.disabled = !ok; p.style.opacity = ok ? 1 : .4; }
  }
  if (k === 'otp') {
    S.otp = digits(e.target.value).slice(0, 6); e.target.value = S.otp;
    const box = document.getElementById('otpboxes'); box.querySelectorAll('div').forEach(d => d.remove()); box.insertAdjacentHTML('afterbegin', otpBoxes());
    const p = document.getElementById('primary'); if (p) { p.disabled = S.otp.length < 6; p.style.opacity = S.otp.length < 6 ? .4 : 1; }
    if (S.otp.length === 6) checkOtp();
  }
});
root.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const p = document.getElementById('primary'); if (p && !p.disabled) p.click();
});
document.addEventListener('keydown', e => {   // พิมพ์ PIN ด้วยคีย์บอร์ดได้บนคอม
  if (cur() === 'shell' && document.activeElement.tagName !== 'INPUT') {
    const fn = S.sub === 'payPin' ? pressPayPin : (S.sub === 'payAmount' || (S.tab === 'receive' && !S.sub)) ? pressAmt : null;
    if (fn) { if (/^\d$/.test(e.key)) fn(e.key); if (e.key === 'Backspace') fn('del'); if (e.key === 'Enter') { const p = document.getElementById('primary'); if (p && !p.disabled) p.click(); } return; }
  }
  const v = cur(); if (v !== 'setPin' && v !== 'loginPin') return;
  if (/^\d$/.test(e.key)) (v === 'setPin' ? pressSet : pressLogin)(e.key);
  if (e.key === 'Backspace') (v === 'setPin' ? pressSet : pressLogin)('del');
});
addEventListener('resize', () => { const w = innerWidth >= 960; if (w !== S.wide) { S.wide = w; render(); } });
setInterval(() => {
  if (S.sub === 'mQr' && S.sale && S.sale.status === 'created') { const el = document.getElementById('qrLeft'); if (el) el.textContent = t().expiresIn.replace('{t}', leftText(S.sale.expires_at)); if (new Date(S.sale.expires_at) < Date.now()) pollSale(); }
  if (S.sec > 0) { S.sec--; if (cur() === 'otp') {
    const T = t(), el = document.getElementById('timer'), b = document.getElementById('resendBtn');
    if (el) el.textContent = S.sec > 0 ? `${T.resendIn} ${Math.floor(S.sec / 60)}:${String(S.sec % 60).padStart(2, '0')}` : T.expired;
    if (b) { b.disabled = S.sec > 0; b.style.opacity = S.sec > 0 ? .4 : 1; }
  } }
}, 1000);

(async function boot(){
  if (S.refresh && await refresh()) {
    try { S.user = await api('GET', '/v1/me', null, true); await Promise.all([loadKyc(), loadHome()]); S.stack = ['shell']; } catch (e) { endSession(); }
  }
  render();
})();
</script>
</body>
